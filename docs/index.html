<title>V-Bucks Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">

<style>
/* Layout: coluna única, max 480px, mobile-first */
:root {
  --bg:       #f0f5fc;
  --surf:     #ffffff;
  --surf2:    #e3ecf8;
  --border:   #c8d7ee;
  --fg:       #0b1422;
  --muted:    #536480;
  --ac:       #1677e8;
  --ac-dim:   rgba(22,119,232,.10);
  --gold:     #b8820e;
  --ok:       #15803d;
  --ok-dim:   rgba(21,128,61,.11);
  --no:       #b91c1c;
  --no-dim:   rgba(185,28,28,.11);
  --wait:     #5b21b6;
  --wait-dim: rgba(91,33,182,.10);
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #060e1b;
    --surf:     #0c1828;
    --surf2:    #122033;
    --border:   #182d47;
    --fg:       #d4e3f7;
    --muted:    #5a7699;
    --ac:       #3da0ff;
    --ac-dim:   rgba(61,160,255,.13);
    --gold:     #eab308;
    --ok:       #22c55e;
    --ok-dim:   rgba(34,197,94,.13);
    --no:       #f87171;
    --no-dim:   rgba(248,113,113,.13);
    --wait:     #a78bfa;
    --wait-dim: rgba(167,139,250,.13);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:       #060e1b;
  --surf:     #0c1828;
  --surf2:    #122033;
  --border:   #182d47;
  --fg:       #d4e3f7;
  --muted:    #5a7699;
  --ac:       #3da0ff;
  --ac-dim:   rgba(61,160,255,.13);
  --gold:     #eab308;
  --ok:       #22c55e;
  --ok-dim:   rgba(34,197,94,.13);
  --no:       #f87171;
  --no-dim:   rgba(248,113,113,.13);
  --wait:     #a78bfa;
  --wait-dim: rgba(167,139,250,.13);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  margin: 0;
  padding-inline: 16px;
  padding-block: 16px 48px;
  max-width: 480px;
  margin-inline: auto;
}

/* ── header ─────────────────────── */
.hd {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
}
.hd-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  flex: 1;
  line-height: 1;
}
.hd-logo span { color: var(--gold); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 40px;
  padding: 0 16px;
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  white-space: nowrap;
  transition: opacity .15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:not(:disabled):active { opacity: .7; }
.btn-primary { background: var(--ac); color: #fff; }
.btn-ghost   { background: transparent; border-color: var(--border); color: var(--fg); min-width: 40px; padding: 0 10px; }

/* ── today card ─────────────────── */
.today {
  border-radius: var(--r);
  border: 1px solid var(--border);
  padding: 20px;
  margin-bottom: 16px;
  background: var(--surf);
}
.today.ok   { background: var(--ok-dim);   border-color: var(--ok); }
.today.no   { background: var(--no-dim);   border-color: var(--no); }
.today.wait { background: var(--wait-dim); border-color: var(--wait); }

.today-eye {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 4px;
}
.today-main {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(24px, 7vw, 34px);
  font-weight: 700; line-height: 1.1;
  text-wrap: balance;
  margin-bottom: 3px;
}
.today.ok   .today-main { color: var(--ok); }
.today.no   .today-main { color: var(--no); }
.today.wait .today-main { color: var(--wait); }
.today-sub { font-size: 12px; color: var(--muted); }

/* ── section heading ─────────────── */
.sh {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px;
  margin-top: 20px;
}

/* ── 30-day grid ─────────────────── */
.grid30 {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(24px, 1fr));
  gap: 4px;
  margin-bottom: 6px;
}
.dc {
  aspect-ratio: 1;
  border-radius: 4px;
  background: var(--surf2);
  border: 1px solid var(--border);
  position: relative;
  cursor: default;
}
.dc.ok  { background: var(--ok); border-color: var(--ok); }
.dc.no  { background: var(--surf2); }
.dc.td  { outline: 2px solid var(--ac); outline-offset: 2px; }

/* tooltip — só desktop (hover) */
@media (hover: hover) {
  .dc::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 5px);
    left: 50%; transform: translateX(-50%);
    background: var(--fg); color: var(--bg);
    font-size: 10px; white-space: nowrap;
    padding: 3px 6px; border-radius: 4px;
    pointer-events: none; opacity: 0;
    transition: opacity .12s; z-index: 10;
  }
  .dc:hover::after { opacity: 1; }
}

.legend {
  display: flex; gap: 12px; flex-wrap: wrap;
  font-size: 11px; color: var(--muted);
  margin-bottom: 4px;
}
.li { display: flex; align-items: center; gap: 4px; }
.ld { width: 9px; height: 9px; border-radius: 2px; border: 1px solid var(--border); }
.ld.ok { background: var(--ok); border-color: var(--ok); }

/* ── runs ────────────────────────── */
.run-list { display: flex; flex-direction: column; gap: 8px; }

.run-card {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px 14px;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
  transition: background .12s;
}
.run-card:active { background: var(--surf2); }

.run-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.run-icon.ok   { background: var(--ok-dim);   color: var(--ok); }
.run-icon.no   { background: var(--no-dim);    color: var(--no); }
.run-icon.run  { background: var(--ac-dim);    color: var(--ac); }
.run-icon.skip { background: var(--surf2);     color: var(--muted); }

.run-info { min-width: 0; }
.run-title {
  font-size: 13px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.run-meta { font-size: 11px; color: var(--muted); }

.run-badge {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 20px;
  white-space: nowrap; flex-shrink: 0;
}
.run-badge.ok   { background: var(--ok-dim);  color: var(--ok); }
.run-badge.no   { background: var(--no-dim);  color: var(--no); }
.run-badge.run  { background: var(--ac-dim);  color: var(--ac); }
.run-badge.skip { background: var(--surf2);   color: var(--muted); }

/* ── feedback ────────────────────── */
.fmsg {
  font-size: 13px; padding: 10px 13px;
  border-radius: 8px; margin-bottom: 14px; display: none;
}
.fmsg.show { display: block; }
.fmsg.ok-m  { background: var(--ok-dim); color: var(--ok); }
.fmsg.err-m { background: var(--no-dim); color: var(--no); }

/* ── footer ──────────────────────── */
.ft {
  font-size: 11px; color: var(--muted);
  display: flex; align-items: center;
  justify-content: space-between;
  flex-wrap: wrap; gap: 6px;
  margin-top: 24px;
}
.pulse {
  display: inline-block;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok); margin-right: 5px;
  animation: beat 2.2s ease-in-out infinite;
}
@keyframes beat { 0%,100%{opacity:1} 50%{opacity:.2} }

/* ── modal (só PAT) ──────────────── */
.mbg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-end;
  padding: 0; z-index: 200;
}
.mbox {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  padding: 24px 20px 32px;
  width: 100%;
}
.m-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px; font-weight: 700;
  letter-spacing: .05em; text-transform: uppercase;
  margin-bottom: 3px;
}
.m-sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 10px; font-weight: 600;
  letter-spacing: .10em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 5px;
}
.field input {
  width: 100%; padding: 11px 13px;
  background: var(--surf2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--fg);
  font-family: 'DM Sans', sans-serif; font-size: 14px;
  min-height: 44px;
}
.field input:focus { outline: 2px solid var(--ac); border-color: transparent; }
.fhint { font-size: 11px; color: var(--muted); margin-top: 4px; }
.m-actions { display: flex; gap: 8px; }
.m-actions .btn { flex: 1; min-height: 46px; font-size: 14px; }

/* skeleton */
.sk { border-radius: 6px; background: var(--surf2); animation: sk 1.4s ease-in-out infinite; }
@keyframes sk { 0%,100%{opacity:1} 50%{opacity:.3} }
</style>

<!-- Tela de login (cobre tudo) -->
<div class="mbg" id="loginScreen" style="align-items:center">
  <div class="mbox" style="border-radius:16px">
    <div style="text-align:center;margin-bottom:20px">
      <div class="hd-logo" style="font-size:24px;display:block;margin-bottom:4px">V-Bucks <span>Monitor</span></div>
      <div style="font-size:12px;color:var(--muted)">Entre para continuar</div>
    </div>
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="loginUser" placeholder="usuario" autocomplete="username" autocapitalize="none">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="loginErr" style="font-size:12px;color:var(--no);margin-bottom:12px;display:none">Usuário ou senha incorretos.</div>
    <button type="button" class="btn btn-primary" id="btnLogin" style="width:100%;min-height:46px;font-size:15px">Entrar</button>
  </div>
</div>

<!-- Header -->
<div class="hd">
  <div class="hd-logo">V-Bucks <span>Monitor</span></div>
  <button type="button" class="btn btn-primary" id="btnTrigger">▶ Disparar</button>
  <button type="button" class="btn btn-ghost" id="btnCfg" title="PAT">⚙</button>
</div>

<!-- Today -->
<div class="today" id="todayCard">
  <div class="today-eye">Hoje</div>
  <div class="today-main sk" style="height:32px;width:60%;margin-bottom:5px">&nbsp;</div>
  <div class="today-sub sk" style="height:13px;width:40%">&nbsp;</div>
</div>

<!-- Feedback -->
<div class="fmsg" id="fmsg"></div>

<!-- History -->
<div class="sh">Últimos 30 dias</div>
<div class="grid30" id="grid"></div>
<div class="legend" style="margin-top:6px">
  <div class="li"><div class="ld ok"></div>V-Bucks</div>
  <div class="li"><div class="ld no"></div>Sem V-Bucks</div>
  <div class="li"><div class="ld"></div>Sem registro</div>
</div>

<!-- Runs -->
<div class="sh">Últimas execuções</div>
<div class="run-list" id="runList">
  <div class="sk" style="height:56px;border-radius:10px"></div>
  <div class="sk" style="height:56px;border-radius:10px"></div>
  <div class="sk" style="height:56px;border-radius:10px"></div>
</div>

<!-- Footer -->
<div class="ft">
  <div><span class="pulse"></span>Atualiza a cada 60 s</div>
  <div id="lastUp">—</div>
</div>

<script>
// ── Credenciais fixas ─────────────────────────────
const SB_URL  = 'https://otytppcftpqtdpmfxkic.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90eXRwcGNmdHBxdGRwbWZ4a2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5ODEyMzAsImV4cCI6MjEwNjU1NzIzMH0.l7WiV2gIGAR02F4mRukKtzse1X3qfXSAp9j9QZFGZ5w';
const REPO    = 'ejuanoli/Projetos_Python';
const WF      = 'vbucks_alert.yml';

// ── Sessão ────────────────────────────────────────
const SESSION_KEY = 'vbm_session';
function getSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s || Date.now() > s.exp) return null;
    return s;
  } catch { return null; }
}
function setSession(pat) {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      pat, exp: Date.now() + 30 * 24 * 60 * 60 * 1000 // 30 dias
    }));
  } catch {}
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch {}
}
function getPat() { return getSession()?.pat || ''; }

// ── Login ─────────────────────────────────────────
const loginScreen = document.getElementById('loginScreen');

async function tryLogin() {
  const usuario = document.getElementById('loginUser').value.trim();
  const senha   = document.getElementById('loginPass').value;
  const btn     = document.getElementById('btnLogin');
  const err     = document.getElementById('loginErr');
  if (!usuario || !senha) return;

  btn.disabled = true; btn.textContent = '⟳';
  err.style.display = 'none';
  try {
    const r = await fetch(`${SB_URL}/rest/v1/rpc/get_pat`, {
      method: 'POST',
      headers: { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_usuario: usuario, p_senha: senha })
    });
    const pat = await r.json();
    if (pat && typeof pat === 'string' && pat.startsWith('ghp_')) {
      setSession(pat);
      loginScreen.hidden = true;
      loadData();
    } else {
      err.style.display = 'block';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginPass').focus();
    }
  } catch(e) {
    err.textContent = 'Erro de conexão. Tente novamente.';
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

document.getElementById('btnLogin').addEventListener('click', tryLogin);
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginPass').focus(); });

// ── Logout (botão ⚙) ─────────────────────────────
document.getElementById('btnCfg').addEventListener('click', () => {
  if (confirm('Sair da sessão?')) {
    clearSession();
    loginScreen.hidden = false;
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
  }
});

// ── Supabase ──────────────────────────────────────
async function fetchAlertas() {
  const r = await fetch(
    `${SB_URL}/rest/v1/alertas_vbucks?order=data.desc&limit=60&select=*`,
    { headers: { apikey: SB_ANON, Authorization: `Bearer ${SB_ANON}` } }
  );
  if (!r.ok) throw new Error(`Supabase ${r.status}`);
  return r.json();
}

// ── GitHub runs ───────────────────────────────────
async function fetchRuns() {
  const headers = { Accept: 'application/vnd.github+json' };
  const pat = getPat();
  if (pat) headers.Authorization = `Bearer ${pat}`;
  const r = await fetch(
    `https://api.github.com/repos/${REPO}/actions/workflows/${WF}/runs?per_page=8`,
    { headers }
  );
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  return (await r.json()).workflow_runs || [];
}

// ── Today ─────────────────────────────────────────
function todayUTC() { return new Date().toISOString().slice(0,10); }

function renderToday(row) {
  const card = document.getElementById('todayCard');
  const key  = todayUTC();
  const label = new Date(key + 'T12:00:00Z')
    .toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  if (!row) {
    card.className = 'today wait';
    card.innerHTML = `<div class="today-eye">Hoje · ${label}</div>
      <div class="today-main">Aguardando...</div>
      <div class="today-sub">Nenhum registro encontrado ainda</div>`;
    return;
  }
  const hora = new Date(row.enviado_em)
    .toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo' });
  if (row.tipo === 'vbucks') {
    card.className = 'today ok';
    card.innerHTML = `<div class="today-eye">Hoje · ${label}</div>
      <div class="today-main">${row.quantidade ?? '?'} V-Bucks 🎯</div>
      <div class="today-sub">Alerta enviado às ${hora} BRT</div>`;
  } else {
    card.className = 'today no';
    card.innerHTML = `<div class="today-eye">Hoje · ${label}</div>
      <div class="today-main">Sem V-Bucks hoje</div>
      <div class="today-sub">Verificado às ${hora} BRT</div>`;
  }
}

// ── Grid 30 dias ──────────────────────────────────
function renderGrid(rows) {
  const byDate = Object.fromEntries(rows.map(r => [r.data, r]));
  const key0   = todayUTC();
  const grid   = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 29; i >= 0; i--) {
    const d = new Date();
    d.setUTCDate(d.getUTCDate() - i);
    const k   = d.toISOString().slice(0,10);
    const lbl = new Date(k + 'T12:00:00Z')
      .toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
    const row = byDate[k];
    const el  = document.createElement('div');
    el.className = 'dc' + (k === key0 ? ' td' : '');
    if (row) {
      el.classList.add(row.tipo === 'vbucks' ? 'ok' : 'no');
      el.dataset.tip = row.tipo === 'vbucks'
        ? `${lbl}: ${row.quantidade ?? '?'} V-Bucks`
        : `${lbl}: sem V-Bucks`;
    } else {
      el.dataset.tip = `${lbl}: sem registro`;
    }
    grid.appendChild(el);
  }
}

// ── Runs ──────────────────────────────────────────
const RUN_LABELS = {
  success:   ['ok',  '✓', 'Sucesso'],
  failure:   ['no',  '✗', 'Falhou'],
  in_progress:['run','⟳', 'Rodando'],
  cancelled: ['skip','—', 'Cancelado'],
  skipped:   ['skip','—', 'Ignorado'],
};
const EVENT_PT = { schedule: 'Agendado', workflow_dispatch: 'Manual', push: 'Push' };

function renderRuns(runs) {
  const list = document.getElementById('runList');
  if (!runs.length) { list.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0">Nenhuma execução encontrada.</div>'; return; }
  list.innerHTML = runs.map(run => {
    const conc   = run.conclusion || (run.status === 'in_progress' ? 'in_progress' : 'skipped');
    const [cls, icon, label] = RUN_LABELS[conc] || ['skip','?', conc];
    const dt     = new Date(run.created_at)
      .toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', timeZone:'America/Sao_Paulo' });
    const evento = EVENT_PT[run.event] || run.event;
    const dur    = run.updated_at && run.status === 'completed'
      ? Math.round((new Date(run.updated_at) - new Date(run.created_at)) / 1000) + 's'
      : '';
    return `<a class="run-card" href="${run.html_url}" target="_blank" rel="noopener">
      <div class="run-icon ${cls}">${icon}</div>
      <div class="run-info">
        <div class="run-title">${dt} BRT</div>
        <div class="run-meta">${evento}${dur ? ' · ' + dur : ''}</div>
      </div>
      <div class="run-badge ${cls}">${label}</div>
    </a>`;
  }).join('');
}

// ── Feedback ──────────────────────────────────────
function showMsg(txt, ok) {
  const el = document.getElementById('fmsg');
  el.textContent = txt;
  el.className = 'fmsg show ' + (ok ? 'ok-m' : 'err-m');
  setTimeout(() => { el.className = 'fmsg'; }, 6000);
}

// ── Trigger ───────────────────────────────────────
document.getElementById('btnTrigger').addEventListener('click', async () => {
  const pat = getPat();
  if (!pat) { openModal(); return; }
  const btn = document.getElementById('btnTrigger');
  btn.disabled = true; btn.textContent = '⟳';
  try {
    const r = await fetch(
      `https://api.github.com/repos/${REPO}/actions/workflows/${WF}/dispatches`,
      { method:'POST',
        headers:{ Authorization:`Bearer ${pat}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json' },
        body: JSON.stringify({ ref:'main' }) }
    );
    if (r.status === 204) {
      showMsg('✓ Workflow disparado! Resultado em ~2 minutos.', true);
      setTimeout(loadData, 8000);
    } else {
      throw new Error(`GitHub ${r.status}`);
    }
  } catch(e) { showMsg(e.message, false); }
  finally { btn.disabled = false; btn.textContent = '▶ Disparar'; }
});

// ── Load ──────────────────────────────────────────
async function loadData() {
  try {
    const [alertas, runs] = await Promise.all([fetchAlertas(), fetchRuns()]);
    renderToday(alertas.find(r => r.data === todayUTC()) || null);
    renderGrid(alertas);
    renderRuns(runs);
    document.getElementById('lastUp').textContent =
      'Atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  } catch(e) {
    showMsg('Erro ao carregar: ' + e.message, false);
  }
}

// ── Boot ──────────────────────────────────────────
if (getSession()) {
  loginScreen.hidden = true;
  loadData();
}
setInterval(() => { if (getSession()) loadData(); }, 60_000);
</script>

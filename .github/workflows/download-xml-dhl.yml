# Download XML/PDF do DHL Link, confronta com o Supabase, envia por Gmail.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   MS_PASSWORD                 ← senha da conta PETASL.ProcessAssistant@dhl.com
#   GMAIL_APP_PASSWORD          ← senha de app do Gmail (ejuan36616@gmail.com)
#   SUPABASE_URL                ← https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   ← service_role (bypassa RLS)
#
# Antes da primeira execução, rode criar_tabela_xmls_dhl_link.sql no Supabase.
#
# Disparo: Actions → Download XML DHL Link → Run workflow
# Agenda: a cada 2 horas (UTC). Ex.: 00:00 UTC = 21:00 de Brasília (UTC-3).

name: Download XML DHL Link

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read

jobs:
  baixar-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gha.txt

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb

      - name: Download XML DHL Link
        env:
          MS_USER: PETASL.ProcessAssistant@dhl.com
          MS_PASSWORD: ${{ secrets.MS_PASSWORD }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
          EMAIL_DESTINO: eduardojuan@dhl.com
          GMAIL_USER: ejuan36616@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: xvfb-run -a python DownloadXMLDHLLink_GHA.py

      - name: Upload arquivos baixados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-dhl-link
          path: saida_dhl_link/**
          if-no-files-found: warn
          retention-days: 7

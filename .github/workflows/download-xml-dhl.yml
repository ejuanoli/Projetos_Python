# Teste: abre o DHL Link e faz login Microsoft com a conta robótica.
#
# Secret necessário:
#   MS_PASSWORD  ← senha da conta PETASL.ProcessAssistant@dhl.com
#   (se já existir OUTLOOK_PASSWORD, também serve)
#
# Disparo manual: Actions → Download XML DHL Link → Run workflow

name: Download XML DHL Link

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-acesso:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gha.txt

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb

      - name: Testar acesso DHL Link
        env:
          MS_USER: PETASL.ProcessAssistant@dhl.com
          MS_PASSWORD: ${{ secrets.MS_PASSWORD }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
        run: xvfb-run -a python DownloadXMLDHLLink_GHA.py

      - name: Upload diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-dhl-link
          path: saida_dhl_link/**
          if-no-files-found: warn
          retention-days: 7

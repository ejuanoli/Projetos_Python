name: Download XML DHL Link

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  baixar-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gha.txt

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb

      - name: Download XML DHL Link
        env:
          MS_USER: PETASL.ProcessAssistant@dhl.com
          MS_PASSWORD: ${{ secrets.MS_PASSWORD }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
          EMAIL_DESTINO: eduardojuan@dhl.com
          GMAIL_USER: ejuan36616@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: xvfb-run -a python DownloadXMLDHLLink_GHA.py

      - name: Upload arquivos baixados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-dhl-link
          path: saida_dhl_link/**
          if-no-files-found: warn
          retention-days: 7

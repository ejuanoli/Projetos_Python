# RPA Apple — exporta Brudam + TSMS e envia os arquivos por e-mail Gmail.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   BRUDAM_USUARIO
#   BRUDAM_SENHA
#   TSMS_USUARIO
#   TSMS_SENHA
#   GMAIL_APP_PASSWORD  ← senha de app do Google da conta ejuan36616@gmail.com
#
# Como gerar a senha de app:
#   https://myaccount.google.com/apppasswords
#   (precisa ter verificação em duas etapas ligada)
#
# Remetente: Gmail | Destino: eduardojuan@dhl.com
#
# Se Brudam/TSMS não abrirem a partir da nuvem, troque runs-on por um
# self-hosted runner na máquina da operação (com Chrome e rede interna).

name: RPA Apple

on:
  workflow_dispatch:
  schedule:
    # UTC: 13:00 e 13:30 = 10:00 e 10:30 em Brasília (UTC-3). Ajuste se quiser.
    - cron: "0,30 13 * * 1-5"

permissions:
  contents: read

jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gha.txt

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb

      - name: Run RPA Apple
        env:
          BRUDAM_USUARIO: ${{ secrets.BRUDAM_USUARIO }}
          BRUDAM_SENHA: ${{ secrets.BRUDAM_SENHA }}
          TSMS_USUARIO: ${{ secrets.TSMS_USUARIO }}
          TSMS_SENHA: ${{ secrets.TSMS_SENHA }}
          EMAIL_DESTINO: eduardojuan@dhl.com
          GMAIL_USER: ejuan36616@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: xvfb-run -a python RPA_Apple_GHA.py

      - name: Upload relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-rpa-apple
          path: saida_rpa_apple/**
          if-no-files-found: warn
          retention-days: 14

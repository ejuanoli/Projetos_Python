name: Alertas V-Bucks Salve o Mundo

on:
  # A rotação diária muda às 00:00 UTC (21:00 BRT). O script só envia depois que a rotação do dia
  # novo aparece, então o primeiro disparo é logo após a virada. O GitHub atrasa crons agendados
  # (às vezes por horas), por isso há disparos de reserva: o script é idempotente (checa o Supabase)
  # e a concorrência abaixo impede envios duplicados.
  schedule:
    - cron: "3 0 * * *"    # 21:03 BRT
    - cron: "18 0 * * *"   # 21:18 BRT (reserva)
    - cron: "38 0 * * *"   # 21:38 BRT (reserva)
    - cron: "8 1 * * *"    # 22:08 BRT (reserva)

  # Permite disparar manualmente
  workflow_dispatch:

concurrency:
  group: vbucks-alert
  cancel-in-progress: false

jobs:
  verificar-vbucks:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # segurança extra; o script para sozinho em 11 min

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Executar script de alertas
        env:
          WHATSAPP_TELEFONE: ${{ secrets.WHATSAPP_TELEFONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python check_vbucks.py
